name: Pint Preview

on:
  push:
    branches:
      - codex/business-vertical-consolidation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Show exact Pint normalization
        shell: bash
        run: |
          vendor/bin/pint app/Http/Controllers/Business/BusinessCatalogController.php app/Services/Business/BusinessCatalogService.php
          git diff -- app/Http/Controllers/Business/BusinessCatalogController.php app/Services/Business/BusinessCatalogService.php
          test -z "$(git status --short -- app/Http/Controllers/Business/BusinessCatalogController.php app/Services/Business/BusinessCatalogService.php)"
