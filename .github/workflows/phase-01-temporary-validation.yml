name: Phase 1 temporary validation

on:
  push:
    branches:
      - codex/phase-01-invitation-onboarding
  pull_request:
    branches:
      - feat/group-spaces-communication

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Frontend build
        run: npm run build

      - name: Focused Phase 1 tests
        run: |
          php artisan test --compact tests/Feature/InvitationJourneyTest.php
          php artisan test --compact tests/Feature/WorkflowIntegrityTest.php
          php artisan test --compact tests/Feature/Auth/RegistrationTest.php
          php artisan test --compact tests/Feature/Groups/GroupAuthorizationTest.php
          php artisan test --compact tests/Feature/Groups/AdmissionAgreementTest.php
          php artisan test --compact tests/Feature/Groups/InvitationRedemptionConcurrencyTest.php

      - name: PHPUnit
        run: php artisan test --compact

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Pint required command
        run: vendor/bin/pint --dirty --format agent

      - name: Pint Phase 1 files
        run: git diff --name-only dee86677cdfd95b6b2887843cba699b21b07f6f0...HEAD -- '*.php' | xargs vendor/bin/pint --test

      - name: Final Git status
        run: git status --short
