name: Phase 22 dependency sync

on:
  push:
    branches:
      - feat/ideal-v1-22-realtime-notifications
    paths:
      - .github/workflows/phase22-dependency-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ideal-v1-22-realtime-notifications

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Generate Composer lock
        run: composer require laravel/reverb:^1.12 --with-all-dependencies --no-interaction --no-progress

      - name: Generate NPM lock
        run: npm install --save-dev laravel-echo pusher-js --ignore-scripts

      - name: Commit generated dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock package.json package-lock.json
          git commit -m "build(realtime): add Reverb and Echo dependencies"
          git push origin HEAD:feat/ideal-v1-22-realtime-notifications
