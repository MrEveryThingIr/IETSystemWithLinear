name: Phase 3 Format Once

on:
  push:
    branches:
      - feat/phase-03-concept-kernel

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format Phase 3 PHP
        shell: bash
        run: |
          git fetch origin feat/phase-02-delivery-operations
          BASE_SHA="$(git merge-base HEAD origin/feat/phase-02-delivery-operations)"
          mapfile -t PHP_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')

          if (( ${#PHP_FILES[@]} == 0 )); then
            exit 0
          fi

          vendor/bin/pint --format agent "${PHP_FILES[@]}"

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          git commit -m "style(concepts): format phase 3 PHP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
