name: Temporary lockfile audit fix

on:
  push:
    branches:
      - codex/formal-v1-shared-host-compatibility
    paths:
      - .github/workflows/lockfile-audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Composer audit report
        shell: bash
        run: |
          set +e
          composer audit --locked --no-interaction > "$RUNNER_TEMP/composer-audit.log" 2>&1
          code=$?
          msg="$(head -n 80 "$RUNNER_TEMP/composer-audit.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::warning title=composer audit exit ${code}::${msg}"

      - name: Fix npm advisories in the lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm run build
          msg="$(git diff --stat | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=lockfile diff::${msg}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "build: update npm lockfile for shell-quote and source-map-js advisories" \
            -m "GHSA-pqg4-j6r4-53mv (shell-quote, critical) and GHSA-68fv-2mgg-jv7q (source-map-js, high), via npm audit fix --package-lock-only."
          git push origin "HEAD:${GITHUB_REF_NAME}"
