name: Build production package

on:
  pull_request:
    branches:
      - integration/v2
  workflow_dispatch:
    inputs:
      version:
        description: Package version label
        required: false
        default: ''
  push:
    branches:
      - release/formal-v1-production
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: PHP 8.4 production package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Package the reviewed source, rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate locked dependencies
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
          npm ci
          npm audit --audit-level=high

      - name: Install production PHP dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Build frontend
        run: npm run build

      - name: Production optimization smoke
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          CACHE_STORE=array php artisan optimize
          CACHE_STORE=array php artisan optimize:clear
          rm -f .env

      - name: Assemble runtime-only package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ github.event.inputs.version }}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          TEMPLATE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              VERSION="$GITHUB_REF_NAME"
            else
              # Branch pushes package the canonical version declared in the
              # production environment template (APP_VERSION).
              VERSION="v${TEMPLATE_VERSION}"
            fi
          fi
          if [[ "${VERSION#v}" != "$TEMPLATE_VERSION" ]]; then
            echo "::error title=Version mismatch::Package ${VERSION} differs from source VERSION=${TEMPLATE_VERSION}"
            exit 1
          fi
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -cd 'A-Za-z0-9._-')"
          PACKAGE="iet-${SAFE_VERSION}"
          ROOT="dist/${PACKAGE}"

          mkdir -p "$ROOT"

          cp artisan composer.json composer.lock VERSION "$ROOT/"
          cp deploy/production.env.example "$ROOT/production.env.example"

          cp -a app bootstrap config database lang public resources routes storage vendor "$ROOT/"

          PHP_RUNTIME="$(php -r 'echo PHP_VERSION;')"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_VERSION="${SAFE_VERSION#v}"
          COMPOSER_LOCK_SHA256="$(sha256sum composer.lock | cut -d' ' -f1)"
          NPM_LOCK_SHA256="$(sha256sum package-lock.json | cut -d' ' -f1)"
          VITE_MANIFEST_SHA256="$(sha256sum public/build/manifest.json | cut -d' ' -f1)"

          # Non-secret provenance: proves which GitHub source a host release runs.
          jq -n \
            --arg package "$PACKAGE" \
            --arg package_version "$SAFE_VERSION" \
            --arg application_version "$APP_VERSION" \
            --arg git_commit "$SOURCE_SHA" \
            --arg git_ref "$GITHUB_REF" \
            --arg git_ref_name "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg built_at "$BUILT_AT" \
            --arg php_target "8.4" \
            --arg php_build_version "$PHP_RUNTIME" \
            --arg node_build_version "$(node --version)" \
            --arg composer_lock_sha256 "$COMPOSER_LOCK_SHA256" \
            --arg package_lock_sha256 "$NPM_LOCK_SHA256" \
            --arg vite_manifest_sha256 "$VITE_MANIFEST_SHA256" \
            '{
              schema: 1,
              package: $package,
              package_version: $package_version,
              application_version: $application_version,
              source: {
                repository: $repository,
                git_commit: $git_commit,
                git_ref: $git_ref,
                git_ref_name: $git_ref_name
              },
              build: {
                built_at: $built_at,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                workflow_run_url: $workflow_run_url,
                php_target: $php_target,
                php_build_version: $php_build_version,
                node_build_version: $node_build_version,
                composer_dev_dependencies: false
              },
              integrity: {
                composer_lock_sha256: $composer_lock_sha256,
                package_lock_sha256: $package_lock_sha256,
                vite_manifest_sha256: $vite_manifest_sha256
              }
            }' > "$ROOT/release-manifest.json"

          cp "$ROOT/release-manifest.json" "${PACKAGE}.release-manifest.json"

          if grep -Eiq 'APP_KEY=base64|password|secret|token' "$ROOT/release-manifest.json"; then
            echo "release-manifest.json must not contain secrets" >&2
            exit 1
          fi

          rm -rf \
            "$ROOT/public/hot" \
            "$ROOT/public/storage" \
            "$ROOT/storage/logs/"* \
            "$ROOT/storage/framework/cache/data/"* \
            "$ROOT/storage/framework/sessions/"* \
            "$ROOT/storage/framework/views/"*

          test -f "$ROOT/public/index.php"
          test -f "$ROOT/public/build/manifest.json"
          test -f "$ROOT/vendor/autoload.php"
          test -f "$ROOT/artisan"
          test -f "$ROOT/release-manifest.json"
          test -f "$ROOT/production.env.example"
          test ! -e "$ROOT/.env"
          grep -q '^DB_ENGINE=InnoDB$' "$ROOT/production.env.example"
          grep -q '^MEDIA_SCANNER_ENABLED=false$' "$ROOT/production.env.example"
          grep -Eq '^APP_KEY=$' "$ROOT/production.env.example"

          (
            cd dist
            zip -qr "../${PACKAGE}.zip" "$PACKAGE"
          )

          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"

          {
            echo "### Production package ${PACKAGE}"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\` (${GITHUB_REF})"
            echo "- Package root directory: \`${PACKAGE}/\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "${PACKAGE}.zip.sha256")\`"
            echo
            echo '```json'
            cat "${PACKAGE}.release-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Machine-readable provenance, also visible through the check-run API.
          echo "::notice title=Package::root=${PACKAGE}/ zip=${PACKAGE}.zip sha256=$(cut -d' ' -f1 "${PACKAGE}.zip.sha256") commit=${SOURCE_SHA}"
          echo "::notice title=release-manifest.json::$(jq -c . "${PACKAGE}.release-manifest.json")"

          echo "PACKAGE_NAME=${PACKAGE}" >> "$GITHUB_ENV"

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
            ${{ env.PACKAGE_NAME }}.release-manifest.json
          if-no-files-found: error
          retention-days: 30
