name: Phase 4B Format Once

on:
  push:
    branches:
      - feat/phase-04-actor-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format Phase 4B files
        run: |
          vendor/bin/pint --format agent \
            app/Actions/Profile/NormalizeProfileIntentData.php \
            app/Actions/Profile/UpdateProfileConceptAssertionVisibility.php \
            app/Models/Concept.php \
            tests/Feature/ActorProfileSemanticsAndIntentsTest.php

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Actions/Profile/NormalizeProfileIntentData.php \
            app/Actions/Profile/UpdateProfileConceptAssertionVisibility.php \
            app/Models/Concept.php \
            tests/Feature/ActorProfileSemanticsAndIntentsTest.php
          git commit -m "style(profile): format phase 4B PHP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
