name: Phase 3C Format Once

on:
  push:
    branches:
      - feat/phase-03-concept-kernel

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format Phase 3C files
        run: |
          vendor/bin/pint --format agent \
            app/Actions/Groups/UpdateSpaceContentStructure.php \
            app/Support/SpaceContentPublicationEvidence.php \
            app/Support/SpaceContentRevisionComposition.php

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/Actions/Groups/UpdateSpaceContentStructure.php \
            app/Support/SpaceContentPublicationEvidence.php \
            app/Support/SpaceContentRevisionComposition.php
          git commit -m "style(concepts): format phase 3C PHP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
