name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.4 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iet_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: MySQL migration portability smoke
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: iet_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan config:clear
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:status
          php artisan config:clear

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Verify PHP formatting
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref_name }}" == "codex/ideal-v1-selective-assembly" || "${{ github.ref_name }}" == codex/review-s0-* || "${{ github.ref_name }}" == release/* ) ]]; then
            echo "Running repository-wide Pint diagnostic for an assembly, S0, or release checkpoint."
            vendor/bin/pint --format agent
            echo "Pint diagnostic diff:"
            git diff --patch -- '*.php'
            git diff --exit-code -- '*.php'
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && ("${{ github.ref_name }}" == "integration/ideal-v1" || "${{ github.ref_name }}" == "main") && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            git fetch origin integration/ideal-v1
            BASE_SHA="$(git merge-base HEAD origin/integration/ideal-v1)"
          fi

          mapfile -t PHP_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed PHP files require Pint verification."
            exit 0
          fi

          printf 'Pint checking %s\n' "${PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Compile Blade views
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Phase 7 rollback/reapply, scheduler, and queue smoke
        run: |
          php artisan migrate:status
          php artisan migrate:rollback --step=3 --force
          php artisan migrate --force
          php artisan migrate:status
          php artisan schedule:list
          php artisan reverb:start --help
          php artisan schedule:run
          php artisan queue:work database --stop-when-empty --tries=1 --timeout=30
          php artisan queue:failed

      - name: SQLite backup and restore smoke
        shell: bash
        run: |
          ORIGINAL_MIGRATIONS="$(php -r '$db = new PDO("sqlite:database/database.sqlite"); echo $db->query("select count(*) from migrations")->fetchColumn();')"
          test "$ORIGINAL_MIGRATIONS" -gt 0

          cp database/database.sqlite /tmp/iet-ci-backup.sqlite
          cp /tmp/iet-ci-backup.sqlite /tmp/iet-ci-restored.sqlite

          RESTORED_MIGRATIONS="$(php -r '$db = new PDO("sqlite:/tmp/iet-ci-restored.sqlite"); echo $db->query("select count(*) from migrations")->fetchColumn();')"
          test "$ORIGINAL_MIGRATIONS" = "$RESTORED_MIGRATIONS"

          DB_DATABASE=/tmp/iet-ci-restored.sqlite php artisan migrate:status

      - name: Test
        run: php artisan test --compact

      - name: Composer security audit
        run: composer audit --locked --no-interaction
