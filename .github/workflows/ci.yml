name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.4 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify formatting for changed PHP files
        shell: bash
        run: |
          git fetch origin feat/group-spaces-communication
          BASE_SHA="$(git merge-base HEAD origin/feat/group-spaces-communication)"
          mapfile -t PHP_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed PHP files require Pint verification."
            exit 0
          fi

          printf 'Pint checking %s\n' "${PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migration, scheduler, and queue smoke
        run: |
          php artisan migrate:status
          php artisan schedule:list
          php artisan schedule:run
          php artisan queue:work database --stop-when-empty --tries=1 --timeout=30
          php artisan queue:failed

      - name: Test
        run: php artisan test --compact

      - name: Composer security audit
        run: composer audit --locked --no-interaction
