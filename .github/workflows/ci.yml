name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: PHP 8.4 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Install JavaScript dependencies
        id: node_dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
            echo "generated_lock=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::package-lock.json is not committed yet; generating it for the Phase 2 closure."
            npm install --ignore-scripts --no-audit --no-fund
            echo "generated_lock=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated npm lockfile
        if: steps.node_dependencies.outputs.generated_lock == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated npm lockfile
        if: steps.node_dependencies.outputs.generated_lock == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): lock npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build frontend
        run: npm run build

      - name: Verify formatting for changed PHP files
        shell: bash
        run: |
          git fetch origin feat/group-spaces-communication
          BASE_SHA="$(git merge-base HEAD origin/feat/group-spaces-communication)"
          mapfile -t PHP_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed PHP files require Pint verification."
            exit 0
          fi

          printf 'Pint checking %s\n' "${PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Migration and scheduler smoke
        run: |
          php artisan migrate:status
          php artisan schedule:list

      - name: Test
        run: php artisan test --compact

      - name: Composer security audit
        run: composer audit --locked --no-interaction
