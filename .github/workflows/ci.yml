name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.4 / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan migrate --force --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Verify formatting for changed PHP files
        shell: bash
        run: |
          git fetch origin feat/group-spaces-communication
          BASE_SHA="$(git merge-base HEAD origin/feat/group-spaces-communication)"
          mapfile -t PHP_FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.php')

          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "No changed PHP files require Pint verification."
            exit 0
          fi

          printf 'Pint checking %s\n' "${PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Phase 7 rollback/reapply, scheduler, and queue smoke
        run: |
          php artisan migrate:status
          php artisan migrate:rollback --step=3 --force
          php artisan migrate --force
          php artisan migrate:status
          php artisan schedule:list
          php artisan schedule:run
          php artisan queue:work database --stop-when-empty --tries=1 --timeout=30
          php artisan queue:failed

      - name: SQLite backup and restore smoke
        shell: bash
        run: |
          ORIGINAL_MIGRATIONS="$(php -r '$db = new PDO("sqlite:database/database.sqlite"); echo $db->query("select count(*) from migrations")->fetchColumn();')"
          test "$ORIGINAL_MIGRATIONS" -gt 0

          cp database/database.sqlite /tmp/iet-ci-backup.sqlite
          cp /tmp/iet-ci-backup.sqlite /tmp/iet-ci-restored.sqlite

          RESTORED_MIGRATIONS="$(php -r '$db = new PDO("sqlite:/tmp/iet-ci-restored.sqlite"); echo $db->query("select count(*) from migrations")->fetchColumn();')"
          test "$ORIGINAL_MIGRATIONS" = "$RESTORED_MIGRATIONS"

          DB_DATABASE=/tmp/iet-ci-restored.sqlite php artisan migrate:status

      - name: Test
        run: php artisan test --compact

      - name: Composer security audit
        run: composer audit --locked --no-interaction
